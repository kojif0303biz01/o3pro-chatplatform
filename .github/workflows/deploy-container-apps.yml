name: Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
      - containerization
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  RESOURCE_GROUP: rg-poc-apps
  CONTAINER_APPS_ENV: env-poc-apps
  REGISTRY_NAME: acrpocapps  # 要変更: ACR名
  API_IMAGE_NAME: o3pro-api
  FUNCTIONS_IMAGE_NAME: o3pro-functions
  LOCATION: japaneast

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
        enable-AzPSSession: true

    # Container Registry作成（存在しない場合）
    - name: Create Azure Container Registry
      run: |
        # ACRが存在するかチェック
        if ! az acr show --name ${{ env.REGISTRY_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} &> /dev/null; then
          echo "Creating Azure Container Registry..."
          az acr create \
            --name ${{ env.REGISTRY_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --location ${{ env.LOCATION }} \
            --sku Basic \
            --admin-enabled true
        else
          echo "Azure Container Registry already exists"
        fi

    - name: Get ACR credentials
      run: |
        echo "ACR_USERNAME=$(az acr credential show --name ${{ env.REGISTRY_NAME }} --query username -o tsv)" >> $GITHUB_ENV
        echo "ACR_PASSWORD=$(az acr credential show --name ${{ env.REGISTRY_NAME }} --query passwords[0].value -o tsv)" >> $GITHUB_ENV
        echo "LOGIN_SERVER=$(az acr show --name ${{ env.REGISTRY_NAME }} --query loginServer -o tsv)" >> $GITHUB_ENV

    - name: Login to ACR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.LOGIN_SERVER }}
        username: ${{ env.ACR_USERNAME }}
        password: ${{ env.ACR_PASSWORD }}

    # APIイメージビルド
    - name: Build and push API image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./apps/api/Dockerfile
        push: true
        tags: |
          ${{ env.LOGIN_SERVER }}/${{ env.API_IMAGE_NAME }}:${{ github.sha }}
          ${{ env.LOGIN_SERVER }}/${{ env.API_IMAGE_NAME }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # Functionsイメージビルド
    - name: Build and push Functions image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./apps/functions/Dockerfile
        push: true
        tags: |
          ${{ env.LOGIN_SERVER }}/${{ env.FUNCTIONS_IMAGE_NAME }}:${{ github.sha }}
          ${{ env.LOGIN_SERVER }}/${{ env.FUNCTIONS_IMAGE_NAME }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # Container Appデプロイ（API）
    - name: Deploy API to Container Apps
      run: |
        # Container App存在チェック
        if ! az containerapp show \
          --name o3pro-api \
          --resource-group ${{ env.RESOURCE_GROUP }} &> /dev/null; then
          
          echo "Creating new Container App for API..."
          az containerapp create \
            --name o3pro-api \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --environment ${{ env.CONTAINER_APPS_ENV }} \
            --image ${{ env.LOGIN_SERVER }}/${{ env.API_IMAGE_NAME }}:${{ github.sha }} \
            --target-port 8000 \
            --ingress external \
            --registry-server ${{ env.LOGIN_SERVER }} \
            --registry-username ${{ env.ACR_USERNAME }} \
            --registry-password ${{ env.ACR_PASSWORD }} \
            --cpu 0.5 \
            --memory 1.0Gi \
            --min-replicas 0 \
            --max-replicas 1 \
            --env-vars \
              ENVIRONMENT=production \
              PORT=8000 \
              WORKERS=2
        else
          echo "Updating existing Container App..."
          az containerapp update \
            --name o3pro-api \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.LOGIN_SERVER }}/${{ env.API_IMAGE_NAME }}:${{ github.sha }}
        fi

    # Container Appデプロイ（Functions）
    - name: Deploy Functions to Container Apps
      run: |
        if ! az containerapp show \
          --name o3pro-functions \
          --resource-group ${{ env.RESOURCE_GROUP }} &> /dev/null; then
          
          echo "Creating new Container App for Functions..."
          az containerapp create \
            --name o3pro-functions \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --environment ${{ env.CONTAINER_APPS_ENV }} \
            --image ${{ env.LOGIN_SERVER }}/${{ env.FUNCTIONS_IMAGE_NAME }}:${{ github.sha }} \
            --registry-server ${{ env.LOGIN_SERVER }} \
            --registry-username ${{ env.ACR_USERNAME }} \
            --registry-password ${{ env.ACR_PASSWORD }} \
            --cpu 0.5 \
            --memory 1.0Gi \
            --min-replicas 0 \
            --max-replicas 5 \
            --scale-rule-name http-rule \
            --scale-rule-type http \
            --scale-rule-http-concurrency 10
        else
          echo "Updating existing Container App..."
          az containerapp update \
            --name o3pro-functions \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.LOGIN_SERVER }}/${{ env.FUNCTIONS_IMAGE_NAME }}:${{ github.sha }}
        fi

    - name: Get Container App URLs
      run: |
        echo "API URL: https://$(az containerapp show --name o3pro-api --resource-group ${{ env.RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv)"
        echo "Functions URL: https://$(az containerapp show --name o3pro-functions --resource-group ${{ env.RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv)"