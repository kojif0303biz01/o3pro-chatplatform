name: Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
      - containerization
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  RESOURCE_GROUP: rg-poc-apps
  CONTAINER_APPS_ENV: env-poc-apps
  REGISTRY_NAME: acrpocapps  # 要変更: ACR名
  API_IMAGE_NAME: o3pro-api
  FUNCTIONS_IMAGE_NAME: o3pro-functions
  LOCATION: japaneast

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      actions: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 最初にデバッグ情報を出力
    - name: Debug Environment and Secrets
      run: |
        echo "=== GitHub Actions Environment Debug ==="
        echo "Runner OS: $RUNNER_OS"
        echo "GitHub Event: $GITHUB_EVENT_NAME"
        echo "GitHub Ref: $GITHUB_REF"
        echo "GitHub Actor: $GITHUB_ACTOR"
        echo ""
        echo "=== Checking GitHub Secrets ==="
        echo "AZURE_CLIENT_ID exists: ${{ secrets.AZURE_CLIENT_ID != '' && 'true' || 'false' }}"
        echo "AZURE_TENANT_ID exists: ${{ secrets.AZURE_TENANT_ID != '' && 'true' || 'false' }}"
        echo "AZURE_SUBSCRIPTION_ID exists: ${{ secrets.AZURE_SUBSCRIPTION_ID != '' && 'true' || 'false' }}"
        echo "AZURE_CLIENT_SECRET exists: ${{ secrets.AZURE_CLIENT_SECRET != '' && 'true' || 'false' }}"
        echo ""
        echo "=== Environment Variables Length Check ==="
        echo "CLIENT_ID length: ${#CLIENT_ID}"
        echo "TENANT_ID length: ${#TENANT_ID}"
        echo "SUBSCRIPTION_ID length: ${#SUBSCRIPTION_ID}"
        echo "CLIENT_SECRET length: ${#CLIENT_SECRET}"
        echo ""
        echo "=== First 8 chars (for verification) ==="
        echo "CLIENT_ID starts with: ${CLIENT_ID:0:8}..."
        echo "TENANT_ID starts with: ${TENANT_ID:0:8}..."
        echo "SUBSCRIPTION_ID starts with: ${SUBSCRIPTION_ID:0:8}..."
      env:
        CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
      continue-on-error: true
      id: azure-login

    # Azure Loginが失敗した場合の詳細確認
    - name: Manual Azure Login Test
      if: steps.azure-login.outcome == 'failure'
      run: |
        echo "=== Azure Login failed, trying manual login ==="
        echo "Installing Azure CLI..."
        curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
        
        echo "Azure CLI version:"
        az --version
        
        echo "Trying service principal login..."
        az login --service-principal \
          --username "$CLIENT_ID" \
          --password "$CLIENT_SECRET" \
          --tenant "$TENANT_ID" \
          --output table
        
        echo "Setting subscription..."
        az account set --subscription "$SUBSCRIPTION_ID"
        
        echo "Verifying access to resource group..."
        az group show --name "$RESOURCE_GROUP" --output table
      env:
        CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        RESOURCE_GROUP: rg-poc-apps

    # Azure Loginが成功した場合の継続確認
    - name: Verify Azure Authentication
      if: steps.azure-login.outcome != 'failure'
      run: |
        echo "=== Azure Login successful, verifying access ==="
        az account show --output table
        az group show --name "$RESOURCE_GROUP" --output table

    # Container Registry作成（存在しない場合）
    - name: Create Azure Container Registry
      run: |
        # ACRが存在するかチェック
        if ! az acr show --name ${{ env.REGISTRY_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} &> /dev/null; then
          echo "Creating Azure Container Registry..."
          az acr create \
            --name ${{ env.REGISTRY_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --location ${{ env.LOCATION }} \
            --sku Basic \
            --admin-enabled true
        else
          echo "Azure Container Registry already exists"
        fi

    - name: Get ACR credentials
      run: |
        echo "ACR_USERNAME=$(az acr credential show --name ${{ env.REGISTRY_NAME }} --query username -o tsv)" >> $GITHUB_ENV
        echo "ACR_PASSWORD=$(az acr credential show --name ${{ env.REGISTRY_NAME }} --query passwords[0].value -o tsv)" >> $GITHUB_ENV
        echo "LOGIN_SERVER=$(az acr show --name ${{ env.REGISTRY_NAME }} --query loginServer -o tsv)" >> $GITHUB_ENV

    - name: Login to ACR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.LOGIN_SERVER }}
        username: ${{ env.ACR_USERNAME }}
        password: ${{ env.ACR_PASSWORD }}

    # APIイメージビルド
    - name: Build and push API image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./apps/api/Dockerfile
        push: true
        tags: |
          ${{ env.LOGIN_SERVER }}/${{ env.API_IMAGE_NAME }}:${{ github.sha }}
          ${{ env.LOGIN_SERVER }}/${{ env.API_IMAGE_NAME }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # Functionsイメージビルド
    - name: Build and push Functions image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./apps/functions/Dockerfile
        push: true
        tags: |
          ${{ env.LOGIN_SERVER }}/${{ env.FUNCTIONS_IMAGE_NAME }}:${{ github.sha }}
          ${{ env.LOGIN_SERVER }}/${{ env.FUNCTIONS_IMAGE_NAME }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # Container Appデプロイ（API）
    - name: Deploy API to Container Apps
      run: |
        # Container App存在チェック
        if ! az containerapp show \
          --name o3pro-api \
          --resource-group ${{ env.RESOURCE_GROUP }} &> /dev/null; then
          
          echo "Creating new Container App for API..."
          az containerapp create \
            --name o3pro-api \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --environment ${{ env.CONTAINER_APPS_ENV }} \
            --image ${{ env.LOGIN_SERVER }}/${{ env.API_IMAGE_NAME }}:${{ github.sha }} \
            --target-port 8000 \
            --ingress external \
            --registry-server ${{ env.LOGIN_SERVER }} \
            --registry-username ${{ env.ACR_USERNAME }} \
            --registry-password ${{ env.ACR_PASSWORD }} \
            --cpu 0.5 \
            --memory 1.0Gi \
            --min-replicas 0 \
            --max-replicas 1 \
            --env-vars \
              ENVIRONMENT=production \
              PORT=8000 \
              WORKERS=2
        else
          echo "Updating existing Container App..."
          az containerapp update \
            --name o3pro-api \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.LOGIN_SERVER }}/${{ env.API_IMAGE_NAME }}:${{ github.sha }}
        fi

    # Container Appデプロイ（Functions）
    - name: Deploy Functions to Container Apps
      run: |
        if ! az containerapp show \
          --name o3pro-functions \
          --resource-group ${{ env.RESOURCE_GROUP }} &> /dev/null; then
          
          echo "Creating new Container App for Functions..."
          az containerapp create \
            --name o3pro-functions \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --environment ${{ env.CONTAINER_APPS_ENV }} \
            --image ${{ env.LOGIN_SERVER }}/${{ env.FUNCTIONS_IMAGE_NAME }}:${{ github.sha }} \
            --registry-server ${{ env.LOGIN_SERVER }} \
            --registry-username ${{ env.ACR_USERNAME }} \
            --registry-password ${{ env.ACR_PASSWORD }} \
            --cpu 0.5 \
            --memory 1.0Gi \
            --min-replicas 0 \
            --max-replicas 5 \
            --scale-rule-name http-rule \
            --scale-rule-type http \
            --scale-rule-http-concurrency 10
        else
          echo "Updating existing Container App..."
          az containerapp update \
            --name o3pro-functions \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.LOGIN_SERVER }}/${{ env.FUNCTIONS_IMAGE_NAME }}:${{ github.sha }}
        fi

    - name: Get Container App URLs
      run: |
        echo "API URL: https://$(az containerapp show --name o3pro-api --resource-group ${{ env.RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv)"
        echo "Functions URL: https://$(az containerapp show --name o3pro-functions --resource-group ${{ env.RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv)"